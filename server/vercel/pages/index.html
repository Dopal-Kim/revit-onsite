<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>현장 입력 · Revit On-Site</title>
<!-- 데이터 계약: docs/field_input_spec.md. 서버: tools/field_server.py (시험용) · Revit On-Site 애드인 (실사용). 외부 파일 없음. -->
<!-- ===== 수정본 (2026-11-07) — 원본: Documents\카카오톡 받은 파일\현장입력.html (원본은 그대로)
  재판(/court) 판결: 유죄 12:0 — "수정 방향은 옳고 원본보다 낫지만, 그대로 내보내기엔 확인이 남음". 무죄 조건 처리 현황:
   1. [확인됨] 상태 흐름 순서 — 사용자 확인 (2026-11-07):
      타설 전 → 양생 중 → 공시체 필요·존치 연장 → 승인 요청 가능 → 감리 승인 기록 → 해체 완료. 흐름 밖: 재받침·설치 결함·설치 합격.
      근거: 샘플 데이터에서 존치 연장(9)은 층수 조건 OK·강도 미달 구역 (9F-A2·B2·C2). 코드: FLOW, SIDE 상수
   2. [남음] 실제 휴대폰 한 바퀴 — 이 파일을 휴대폰으로 보내 그대로 열면(file://) 안의 미리보기 서버로 샘플이 뜸.
      확인할 것: 구역 → 종류 → 입력 → 저장 결과, 입력 오류 요약, 오프라인 저장, 햇빛 모드, 장갑 낀 손으로 버튼 누르기.
      (에뮬레이션 375×812 에서는 저장 결과·오프라인 저장·입력 오류 문구 렌더까지 확인함)
   3. [확인됨] 해체 후 점검 AC-1~5 의 예 = OK — 서버 모델의 동바리 점검 '해체 후' 단계에 같은 AC-1~5 가
      OK/NG 로 들어 있고("[확정] 해체 가이드라인 4.3"), 원본 코드 주석도 "예 → OK, 아니오 → NG". 항목은 질문이 아니라 점검 항목 이름.
===== -->
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#111; --sub:#4a5260; --line:#c9ced6; --acc:#0b5cad; --acc-ink:#fff;
  --err:#b00020; --ok:#1a7f37; --warn:#8a5a00; --chip:#e6e9ee; --focus:#ffbf00;
  --s0:rgb(160,160,160); --s1:rgb(171,190,209); --s2:rgb(215,48,39); --s3:rgb(69,117,180); --s4:rgb(254,224,139);
  --s5:rgb(145,207,96); --s6:rgb(26,152,80); --s7:rgb(115,115,115); --s8:rgb(128,100,162); --s9:rgb(244,109,67);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181f; --card:#1f2630; --ink:#f2f4f7; --sub:#b3bccb; --line:#3a4452; --acc:#4da3ff; --acc-ink:#06121f;
         --err:#ff8a8a; --ok:#6fdc8c; --warn:#ffcc66; --chip:#2b3440; }
}
/* 햇빛 모드 (ui_reference_research 7절 #13): 머리의 [햇빛] 을 누르면 고대비 — 흰 바탕, 글자 #000, 보조 #222, 경고 #6b4500·오류 #8b0018·확인 #0b4f1e (모두 7:1 이상) */
html.sun{--bg:#fff;--card:#fff;--ink:#000;--sub:#222;--line:#555;--acc:#0a3f7a;--acc-ink:#fff;--err:#8b0018;--ok:#0b4f1e;--warn:#6b4500;--chip:#e6e9ee}
html.sun .tile .st,html.sun .tile .due{text-shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
/* 포커스: 밝은 바탕에선 진한 파랑, 어두운 바탕에선 노랑 (노랑은 흰 바탕에서 대비가 약 1.6:1 이라 안 보임) */
:root{--ring:#0b2f6b}
@media (prefers-color-scheme: dark){:root{--ring:#ffbf00}}
html.sun{--ring:#000}
:focus-visible{outline:4px solid var(--ring);outline-offset:2px}
header :focus-visible{outline-color:#ffbf00}
header{position:sticky;top:0;z-index:5;background:#1f2a37;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{display:inline-flex;align-items:center;gap:6px;font-size:16px}
.net i{width:12px;height:12px;border-radius:50%;background:#6fdc8c;display:inline-block}
.net.off i{background:#ff6b6b}
/* [보낼 것 N건] 배지가 뜨면 연결 글자는 점만 남김 (화면 낭독기에는 그대로) — 머리 제목 "현장 · 층"이 잘리지 않게 */
header:has(#badge:not([hidden])) .net span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header h1{min-width:0}
.badge{min-height:44px;border:0;border-radius:22px;padding:0 14px;background:#ffcc00;color:#000;font-weight:700;font-size:16px}
.badge[hidden]{display:none}
.stale{position:sticky;top:56px;z-index:4;display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;padding:8px 12px;background:#ffcc00;color:#000;font-size:16px;border-bottom:2px solid #000}
.stale b{font-size:16px}
#sun{background:#fff;color:#000;border:2px solid #fff}
#sun[aria-pressed=true]{background:#ffcc00;border-color:#000;box-shadow:0 0 0 2px #ffcc00}
main{padding:12px;max-width:520px;margin:0 auto}
h2{font-size:22px;margin:18px 0 8px}
h2:focus{outline:none}
.sub{color:var(--sub);font-size:16px}
.alerts summary{font-weight:700;color:var(--warn);cursor:pointer}.alerts.urgent summary{color:var(--err)}.alerts li{margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
#floors{display:block;overflow-x:auto}   /* 구역이 많은 층은 표만 옆으로 밀림 (칸 40px 아래로 줄이지 않음) */
.mx-row{display:flex;gap:4px;align-items:stretch;margin:0 0 4px}
.mx-fl{flex:0 0 56px;min-height:52px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:800;font-size:16px}
.mx-row[aria-current="true"] .mx-fl{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.mx-c{flex:1 1 0;min-width:40px;min-height:52px;border:2px solid transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px}
.mx-c b{font-size:16px}.mx-c span{font-size:13px;font-weight:600}
.mx-row[aria-current="true"] .mx-c{border-color:var(--ink)}
.ktabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none;align-items:center;position:sticky;top:56px;z-index:3;background:var(--bg)}
.ktabs .kt-z{font-weight:800;padding:0 6px;white-space:nowrap}
.ktabs button{flex:0 0 auto;min-height:48px;padding:0 14px;border-radius:24px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;white-space:nowrap}
.ktabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.quick{display:flex;gap:8px;margin:8px 0 0}.quick button{flex:1 1 0;max-width:160px;min-height:52px;padding:0 18px;border-radius:26px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:18px}
input[type=file]{width:100%;min-height:60px;padding:6px;border:2px dashed var(--line);border-radius:10px;background:var(--card);color:var(--sub);font-size:16px}
input[type=file]::file-selector-button{min-height:48px;margin-right:12px;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:18px;cursor:pointer}
.chip{flex:0 0 auto;min-height:52px;min-width:64px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:18px}
.chip[aria-pressed=true]{font-weight:700;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip small{display:block;font-weight:400;font-size:16px;line-height:1.15}
.chip.tall{min-height:60px;text-align:left;padding:6px 14px}
/* 평면 구역 타일: 실제 좌표 배치 (북 = 위) */
.plan{position:relative;width:100%;margin:4px 0 6px}
.tile{position:absolute;border:2px solid var(--bg);border-radius:8px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;font-weight:700}
.tile{container-type:inline-size}   /* 야외 가독성 (ui_reference_research 7절 #12): 상태·날짜 16px, 좁은 타일은 구역명 18px */
.tile .zn{font-size:22px;line-height:1}
.tile .st{font-size:16px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}   /* 한글은 띄어쓰기에서만 줄바꿈 ("승인 요청 / 가능") */
.tile .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.tile .sn{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;min-width:0}
.tile .sn i{font-style:normal;font-size:14px;line-height:1.3;font-weight:700;background:rgba(255,255,255,.92);color:#000;border-radius:4px;padding:0 4px;white-space:nowrap}
.tile .due{font-size:16px;font-weight:600}
@container (max-width:90px){.tile .zn{font-size:18px}}
.tile[aria-current=true]{outline:4px solid var(--ink);outline-offset:-4px}
/* 색만으로 구분이 어려운 상태에 무늬 (상태색 값은 ui_spec §6 그대로): 타설 전 = 점선 테두리(아직 없음), 해체 완료 = 빗금(끝남), 감리 승인 기록 = 굵은 안쪽 테두리 */
.tile.s0,.flow .s0 i{border:2px dashed rgba(0,0,0,.55)}
.tile.s7,.flow .s7 i{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.tile.s6,.flow .s6 i{box-shadow:inset 0 0 0 3px rgba(0,0,0,.45)}
.tag.zt{font-size:16px;padding:3px 10px}
.tag.zt.s0{border:2px dashed rgba(0,0,0,.55)}
.tag.zt.s7{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.tag.zt.s6{box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #000;pointer-events:none}
.dot.w{border-radius:3px}
.dot b{position:absolute;left:12px;top:-6px;font-size:14px;background:rgba(255,255,255,.9);color:#000;padding:0 3px;border-radius:3px;white-space:nowrap}
.dot.r b{left:auto;right:12px}
.dot.new{background:var(--focus)}
.north{position:absolute;right:4px;top:-22px;font-size:14px;color:var(--sub)}
/* 상태 흐름 (범례 겸 층 요약): 여섯 칸 막대 + 이름 + 이 층 구역 수. 없는 단계는 흐리게 */
.flow{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.flow li{min-width:0;font-size:16px;line-height:1.2;color:var(--sub);opacity:.45}
.flow li.on{opacity:1;color:var(--ink)}
.flow i{display:block;box-sizing:border-box;height:12px;border-radius:3px;background-color:var(--c);margin-bottom:5px}
.flow span{display:block;word-break:keep-all}
.flow b{display:block;font-size:18px;line-height:1.3}
.flow b.sm{font-size:16px;line-height:1.25;word-break:keep-all}
.flow.side{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:flex-start;margin-top:10px}
.flow.side li{opacity:1;color:var(--ink)}.flow.side i{width:100%}
.flow.side .lead{color:var(--sub);align-self:center}
.flow.mini{gap:3px;margin:8px 0 2px}.flow.mini span{display:none}
.flow.mini i{height:8px;margin:3px 0 0}
.flow.mini li{opacity:.25}.flow.mini li.past{opacity:.7}
.flow.mini li.on{opacity:1}.flow.mini li.on i{height:14px;margin:0;outline:2px solid var(--ink);outline-offset:1px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kh{font-size:16px;font-weight:600;color:var(--sub);margin:16px 0 8px}
#kinds .kh:first-child{margin-top:4px}
.kind{min-height:96px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;padding:12px;font-size:22px;font-weight:700}
.kind small{display:block;font-size:16px;font-weight:400;word-break:keep-all;color:var(--sub);margin-top:4px}
.kind.ref{border-style:dashed}
.zcard{border-left:12px solid var(--c);}
.dec{font-size:22px;font-weight:800;margin:6px 0 2px}
.dec.ok{color:var(--ok)}.dec.no{color:var(--warn)}
.zcard .why{font-size:16px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:16px}
.kv dt{color:var(--sub);font-size:16px;white-space:nowrap}.kv dd{margin:0;word-break:keep-all}
.zwarn{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn);font-size:16px}
.zwarn ul{margin:2px 0 6px;padding-left:18px}.zwarn li{margin:4px 0}
.zwarn summary{min-height:44px;font-weight:700}
/* 카드 안 접힘: 작은 회색 제목, 펼치면 본문 */
.zcard .more summary{min-height:48px;font-size:16px;font-weight:600;color:var(--sub)}
.zcard .more summary::before{font-size:16px}
.zcard .more .mb{font-size:14px;color:var(--sub);padding:0 0 6px 22px;word-break:keep-all;overflow-wrap:anywhere}
.zcard .more .mb ul{margin:0;padding-left:16px}
.zcard .more.w summary{color:var(--warn)}
.zcard .more.basis{margin-top:6px;border-top:1px solid var(--line)}
label{display:block;font-weight:600;margin:14px 0 6px}
label .sub{font-weight:400}
input,select,textarea{width:100%;min-height:56px;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px;font-size:18px}
input[inputmode=decimal]{font-size:28px;font-weight:700;letter-spacing:.5px}
textarea{min-height:160px;font:16px/1.4 ui-monospace,Consolas,monospace}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err);background:color-mix(in srgb,var(--err) 8%,var(--card))}
.err{color:var(--err);font-weight:700;font-size:16px;margin:6px 0 0}
.err:empty{display:none}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three label{margin-top:0;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:52px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;font-size:18px}
.seg button[aria-pressed=true]{font-weight:700;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.avg{font-size:18px;margin-top:8px;font-weight:700}.avg.sub{font-weight:400;font-size:16px}.avg.ok{color:var(--ok)}.avg.no{color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.bar[hidden]{display:none}
.btn{min-height:60px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:18px;padding:0 16px}
.btn.sec{flex:1}
.btn.pri{flex:1;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.55}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line);padding:10px 2px;font-size:16px}
.list li:last-child{border-bottom:0}
.list .k{font-weight:700}
.tag{display:inline-block;font-size:16px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--chip);margin-left:4px}
.tag.q{background:#ffcc00;color:#000}.tag.f{background:var(--err);color:#fff}.tag.s{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:color-mix(in srgb,var(--ok) 72%,var(--ink))}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;min-height:48px;padding:0 6px;text-decoration:underline}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.msg.e{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.msg.w{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.msg.o{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.pv{font-size:16px;color:var(--sub);margin-top:6px}
details summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";flex:0 0 auto;margin-right:8px;font-size:20px;line-height:1;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details summary .sub{margin-left:6px;font-weight:400}   /* 제목이 flex 라 사이 공백이 사라짐 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* F16 동바리 점검 평면 (SVG, 미터 좌표) — 선 굵기는 확대해도 그대로 */
.siitem{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;background:var(--card)}
.siitem[data-active=true]{border-color:#d71920}
.splan{display:block;width:100%;max-height:62vh;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--card);border:2px solid var(--line);border-radius:12px;margin-top:8px}
.splan .zr{fill:var(--chip);stroke:var(--line);stroke-width:1px;vector-effect:non-scaling-stroke}
.splan .zr.me{fill:color-mix(in srgb,var(--acc) 10%,var(--card));stroke:var(--acc);stroke-width:3px}
.splan circle{fill:#fff;stroke:#000;stroke-width:2px;vector-effect:non-scaling-stroke}
.splan .was circle{stroke:#d71920;stroke-dasharray:4 3}
.splan .oth circle{stroke:#d71920;stroke-width:4px;stroke-dasharray:none}
.splan .sel circle{fill:#d71920;stroke:#000;stroke-width:2px;stroke-dasharray:none}
.splan text{display:none;font-size:.16px;text-anchor:middle;fill:var(--ink)}
.splan.lab text{display:block}
.zbar{display:grid;grid-template-columns:1fr 1fr 2fr 2fr;gap:6px;margin-top:6px}.zbar .btn{min-height:52px;padding:0 6px;font-size:18px}
.zbar .btn[data-zm=in],.zbar .btn[data-zm=out]{font-size:26px;line-height:1}
.allok{display:block;width:100%;min-height:52px;margin:6px 0 4px;font-size:18px;border-color:var(--ok);color:var(--ok)}
[hidden]{display:none!important}
.s2{background:#8b0018;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;margin:8px 0}.s2 small{display:block;font-weight:600}
#notify{margin:10px 0}#notify button{min-height:48px;padding:0 16px;border-radius:24px;font-weight:800;background:var(--card);color:var(--ink);border:2px solid var(--line)}

<body>
<header>
  <h1>현장 입력</h1>
  <span class="net" id="net" role="status"><i aria-hidden="true"></i><span>연결 확인 중</span></span>
  <button class="badge" id="badge" hidden type="button" aria-label="휴대폰에 남은 기록 다시 보내기"></button>
  <button class="badge" id="sun" type="button" aria-pressed="false" title="햇빛 아래에서 글자를 더 진하게">햇빛</button>
</header>
<!-- 오프라인으로 저장된 판정을 보는 중이면 어느 화면에서나 머리 바로 아래에 기준 시각을 띄움 (오래된 판정으로 해체하지 않게) -->
<div class="stale" id="stale" role="status" hidden></div>
<div class="syncage" id="syncage" role="status" hidden></div>
<p class="sr" aria-live="polite" id="live"></p>
<main>
  <nav class="ktabs" id="ktabs" role="tablist" aria-label="이 구역 입력" hidden></nav>
  <!-- 1. 층 → 구역 -->
  <section id="s-zone" data-step="zone">
    <div id="topmsg"></div>
    <div id="s2"></div>
    <!-- 오늘 볼 것 (D4, alerts.py) — 종류별 개수, 누르면 목록·구역으로 이동. 판정은 안 바꿈 -->
    <details class="card alerts" id="alerts" hidden><summary id="alertSum"></summary><ul class="list" id="alertList"></ul></details>
    <h2 tabindex="-1">층 × 구역 <span class="sub">칸을 누르면 그 구역 입력</span></h2>
    <div id="floors" class="mx" role="group" aria-label="층과 구역 상태"></div>
    <h2 id="planTitle">구역 평면</h2>
    <div class="plan" id="plan"></div>
    <div class="legend" id="legend"></div>
    <details class="card" id="shoreInfo" open><summary>동바리 사양·해체 이력</summary><div class="sub" id="shoreInfoBody"></div></details>
    <div class="card">
      <div class="row"><strong style="flex:1">최근 입력</strong><button class="lnk" type="button" id="reloadRecent">새로고침</button></div>
      <ul class="list" id="recent"><li class="sub">불러오는 중…</li></ul>
    </div>
    <p class="sub" id="meta"></p>
    <p><a id="tlink" hidden>강도 타임라인 (상시 웹) →</a></p>
    <div id="notify" hidden></div>
  </section>

  <!-- 2. 측정 종류 -->
  <section id="s-kind" data-step="kind" hidden>
    <div class="card zcard" id="zcard"></div>
    <h2 tabindex="-1">무엇을 기록할까요?</h2>
    <div id="kinds"></div>
  </section>

  <!-- 3. 입력 -->
  <section id="s-form" data-step="form" hidden>
    <h2 tabindex="-1" id="ftitle"></h2>
    <p class="sub" id="fsub"></p>
    <form id="form" novalidate autocomplete="off"></form>
  </section>

  <!-- 4. 결과 -->
  <section id="s-done" data-step="done" hidden>
    <h2 tabindex="-1">저장 결과</h2>
    <div id="result"></div>
  </section>
</main>
<div class="bar" id="bar" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
// 0-7 (v6.3·v6.4) 열쇠: 주소의 t·v·r·s 를 기기에 옮기고 주소창에서 지움 — 화면은 열쇠 없이 열리고 자료 API 만 열쇠로 (server/vercel/API.md §9.1).
// 역할마다 하나(onsite.tok.t …), 화면마다 마지막에 쓴 역할(onsite.tok.last/경로).
function takeToken(keys) {
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem("onsite.tok." + k); localStorage.setItem("onsite.tok." + k, v); } catch (_) {} return null; };
  const u = new URL(location.href), k = keys.find(x => u.searchParams.get(x));
  if (k) { ls(k, u.searchParams.get(k)); ls("last" + location.pathname, k); }
  if (keys.some(x => u.searchParams.has(x))) {   // v6.4: Wi-Fi 서버(field_server·C#)도 화면을 열쇠 없이 내서 어디서나 지움
    keys.forEach(x => u.searchParams.delete(x)); history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  }
  const use = k || [ls("last" + location.pathname), ...keys].find(x => x && keys.includes(x) && ls(x));
  return {k: use || keys[0], v: (use && ls(use)) || ""};
}
// 0-5 (v6.3) "마지막 Revit 동기화 n분 전" — Vercel 서버만 (답에 synced_at). 60분 넘으면 빨강. synced_at = PC 한국 시각
function syncAge(syncedAt) {
  if (!syncedAt) return null;
  const min = Math.max(0, Math.round((Date.now() - Date.parse(String(syncedAt).slice(0, 19) + "+09:00")) / 6e4));
  const t = min < 1 ? "방금" : min < 120 ? `${min}분 전` : min < 2880 ? `${Math.round(min / 60)}시간 전` : `${Math.round(min / 1440)}일 전`;
  return min > 60 ? {old: true, text: `PC 동기화가 멈췄습니다. 담당자에게 알려 주세요 (마지막 동기화 ${t})`} : {old: false, text: `마지막 Revit 동기화 ${t}`};
}
const TOKEN = takeToken(["t"]).v;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});   // v6.4 2-3 오프라인 열기 — sw.js 는 Vercel 만 있음 (Wi-Fi 서버는 404 → 조용히 넘어감, LAN IP 는 브라우저가 서비스 워커를 안 줌)
const LS = {
  get(k, d) { try { const v = localStorage.getItem("field." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("field." + k, JSON.stringify(v)); return true; } catch (e) { return false; } }   // false = 저장 공간 모자람
};
// ui_spec §6 상태 색 + 짧은 글자 (색만으로 구분하지 않게)
const MX_ABBR = {0: "전", 1: "설치", 2: "결함", 3: "양생", 4: "공시체", 5: "요청", 6: "승인", 7: "완료", 8: "재받침", 9: "존치"};   // 표 칸 짧은 글자 (색만으로 구분하지 않게)
const STATUS = {0:["타설 전","--s0","#000"],1:["설치 합격","--s1","#000"],2:["설치 결함","--s2","#fff"],3:["양생 중","--s3","#fff"],
  4:["공시체 필요","--s4","#000"],5:["승인 요청 가능","--s5","#000"],6:["감리 승인 기록","--s6","#000"],7:["해체 완료","--s7","#fff"],
  8:["재받침","--s8","#fff"],9:["존치 연장","--s9","#000"]};
const KIND = {
  cylinder:{label:"공시체", sub:"현장양생 · 판정 근거"},
  sensor_temp:{label:"온도 센서", sub:"성숙도로 강도 추정", unit:"°C", col:"temp_c", vlabel:"온도"},
  sensor_strength:{label:"강도 센서", sub:"무선 센서 강도 추정", unit:"MPa", col:"mpa", vlabel:"추정 강도"},
  rebound:{label:"반발경도", sub:"참고 · 판정 미사용", ref:true},
  shore_check:{label:"동바리 확인", sub:"타설 전 · 아래층 동바리가 서 있는지"},
  pour_batch:{label:"타설 전 일괄 확인", sub:"아래 3개층 동바리를 한 화면에서"},   // v6.4 2-2 — 저장은 구역마다 shore_check (새 PC route 없음)
  after_check:{label:"해체 후 점검", sub:"참고 · 판정 미사용 · 가이드라인 4.3", ref:true},
  shore_inspect:{label:"동바리 점검", sub:"설치·일상·해체 전후 · 문제 동바리 표시"}   // F16 — 설치 검측 NG 미해결이면 해체 요청 불가·타설 보류
};
const AC = [["AC-1", "필러·지지 동바리 타설층 포함 하부 3개층 설치"], ["AC-2", "각 층 같은 위치(상하 정렬)"], ["AC-3", "연직도"],
  ["AC-4", "자재 변형·침하"], ["AC-5", "콘크리트 면 결함"]];   // shoring/after_check.py ITEMS 와 같게
let model = LS.get("model", null), online = false, flushing = false;
const st = {floor: LS.get("floor", null), zone: null, kind: null, sensor: null, mode: "one", curing: null, nx: null, ny: null};
let queue = LS.get("queue", []);
let shoreCache = LS.get("shores", {});   // F16: 층 → {rects, shores, ng} (/api/floor 마지막 응답)
const SHRINK = location.protocol === "https:";   // https = Vercel 서버 (요청 4.5 MB) → 사진을 줄여 보냄. http = 현장 Wi-Fi 서버 → 원본 그대로
const PHOTO_MAX = (SHRINK ? 3 : 8) * 1024 * 1024, PHOTO_QUEUE_MAX = 3;   // [가정] 사진 1장 상한 — Wi-Fi 서버 photos.MAX_BYTES 8 MB · Vercel 은 줄인 뒤 3 MB · 기기에 담아 둘 사진 수 (localStorage 약 5 MB)

// ---------- 기기 ID (client_id 앞부분). http 에서도 되는 getRandomValues ----------
let dev = LS.get("device", "");
if (!dev) { const a = new Uint8Array(8); crypto.getRandomValues(a); dev = Array.from(a, b => b.toString(16).padStart(2, "0")).join(""); LS.set("device", dev); }
function nextId() { const n = LS.get("seq", 0) + 1; LS.set("seq", n); return dev + "-" + n; }

// ---------- 시간 (서버가 --at 이면 그 시각을 '지금'으로) ----------
const pad = n => String(n).padStart(2, "0");
function nowStr() {
  if (model && model.fixed_now) return model.now;
  const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const today = () => nowStr().slice(0, 10);
const TSRE = /^\s*(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})[T ]+(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*$/;
function normTs(s) { const m = TSRE.exec(s); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}T${pad(m[4])}:${m[5]}` : null; }
const num = s => { const t = String(s ?? "").trim().replace(",", "."); return t === "" || !/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(t) ? NaN : Number(t); };

// 서버 판(Vercel): 요청 4.5 MB 상한 → 올리기 전에 긴 변 1600 px · JPEG 0.8 로 줄임, 줄인 뒤 3 MB 넘으면 거부 (총괄 11-08 결정)
const PHOTO_HINT = SHRINK ? "긴 변 1600 px 로 줄여 근거 사진으로 저장 · 3 MB 이하" : "원본 그대로 근거 사진으로 저장 · 8MB 이하 JPEG·PNG";
function shrinkPhoto(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/jpeg", 0.8);
      (d.length - d.indexOf(",") - 1) * 3 / 4 > PHOTO_MAX ? no(new Error("big")) : ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("read")); };
    img.src = url;
  });
}

// ---------- 서버 ----------
async function api(path, body) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), body && body.photo_data ? 90000 : 10000);   // 사진은 올리는 데 오래 걸림
  try {
    const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN), {
      method: body ? "POST" : "GET", cache: "no-store", signal: ctl.signal,
      headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
    let j = null; try { j = await r.json(); } catch (e) {}
    return {status: r.status, j: j || {ok: false, error: "서버 응답을 읽지 못했습니다"}};
  } catch (e) { return {status: 0, j: {ok: false, error: "연결 안 됨"}}; }
  finally { clearTimeout(tm); }
}
function setOnline(v, why) {
  online = v; const n = $("#net"); n.classList.toggle("off", !v);
  const p = (typeof queue !== "undefined" ? queue : []).filter(q => q.state === "pending").length;
  n.lastElementChild.textContent = v ? "연결됨" : (why || "오프라인") + (p ? ` · ${p}건 대기` : "");   // v6.4 2-3
  renderStale();
}
function renderStale() {
  const s = $("#stale"); s.hidden = online || !model; if (s.hidden) return;
  const t = String(model.now || "").replace("T", " ").slice(5).replace("-", "/");
  s.innerHTML = `<b>저장된 판정 · ${esc(t)} 기준</b>${model.fetched ? `<span>받은 시각 ${esc(model.fetched)}</span>` : ""}`;
}
async function loadModel() {
  const r = await api("/api/model");
  if (r.status === 200 && r.j.ok) { model = r.j; model.fetched = nowClock(); LS.set("model", model); setOnline(true); serverExtra(model, "t=" + encodeURIComponent(TOKEN)); }
  else setOnline(false, r.status === 403 ? "접속 코드 만료" : "오프라인");
  if (r.status === 403) topMsg("e", "서버가 다시 켜져 접속 코드가 바뀌었습니다. PC 화면의 새 QR 코드로 다시 여세요. 입력한 기록은 이 휴대폰에 남아 있습니다.");
  else if (model && model.error) topMsg("e", "판정 계산 오류: " + model.error);
  else topMsg();
}
const nowClock = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nowStamp = () => { const d = new Date(); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${nowClock()}`; };   // 큐 시각: 하루 지난 실패도 알아보게 날짜까지 (감사 A-30)
function topMsg(kind, text) { $("#topmsg").innerHTML = text ? `<div class="msg ${kind}" role="alert">${esc(text)}</div>` : ""; }
function say(t) { $("#live").textContent = t; }

// ---------- 오프라인 큐 ----------
function saveQueue() {
  // 사진(F15)은 기기에 3장까지·저장 공간이 되는 만큼만 담음 — 넘치면 최근 것부터 사진만 빼고 저장. 이 화면을 연 동안은 메모리의 사진으로 보냄(photoMem)
  const keep = new Set(queue.filter(q => q.body.photo_data).slice(0, PHOTO_QUEUE_MAX));
  for (;;) {
    for (const q of queue) q.photoMem = !!q.body.photo_data && !keep.has(q);
    const copy = queue.map(q => q.photoMem ? {...q, photoMem: false, photoDropped: true, body: {...q.body, photo_data: undefined}} : q);
    if (LS.set("queue", copy) || !keep.size) break;
    keep.delete([...keep].pop());
  }
  renderBadge();
}
const photoNote = q => q.photoMem ? " · 화면을 닫으면 사진은 빠집니다" : q.photoDropped ? " · 사진 빠짐 · 연결된 뒤 다시 찍어 보내 주세요" : q.body.photo_data ? " · 사진 1장" : "";
function renderBadge() {
  const p = queue.filter(q => q.state === "pending").length, f = queue.filter(q => q.state === "failed").length;
  const b = $("#badge"); b.hidden = !(p || f);
  b.textContent = p ? `보낼 것 ${p}건` : `실패 ${f}건`;
  b.style.background = p ? "#ffcc00" : "#ff6b6b";
}
async function send(item) {          // → "ok" | "bad" | "net" | "token"
  const r = await api("/api/measure", item.body);
  if (r.status === 200 && r.j.ok) { item.res = r.j; return "ok"; }
  if (r.status === 400) { item.error = r.j.error; return "bad"; }
  if (r.status === 403) { setOnline(false, "접속 코드 만료"); return "token"; }
  setOnline(false); return "net";    // 0·5xx: 저장 안 됐을 수 있음 → 남겨 두고 다시 보냄 (client_id 로 중복 방지)
}
async function flush() {
  if (flushing) return; flushing = true;
  try {
    for (const it of queue.filter(q => q.state === "pending")) {
      const r = await send(it);
      if (r === "ok") { queue = queue.filter(q => q !== it); setOnline(true); applyResult(it.res); }
      else if (r === "bad") it.state = "failed";
      else break;
      saveQueue();
    }
  } finally { flushing = false; renderBadge(); }
  if (!$("#s-zone").hidden) { renderZones(); loadRecent(); }
}
function applyResult(res) {     // 응답의 그 층 구역 판정으로 타일 갱신 (모델 다시 받지 않아도)
  if (!model || !res || !res.floor_zones || !res.floor_zones.length) return;
  const fl = floorOfZone(res.floor_zones[0].zone_id), f = model.floors.find(f => f.floor === fl);
  if (f) { f.zones = res.floor_zones; LS.set("model", model); }
}
function floorOfZone(zid) { for (const f of model.floors) if (f.zones.some(z => z.zone_id === zid)) return f.floor; return null; }

// ---------- 화면 이동 (휴대폰 뒤로 버튼 = 앞 단계) ----------
function go(step, push = true) {
  for (const s of document.querySelectorAll("main > section")) s.hidden = s.dataset.step !== step;
  if (push) history.pushState({step}, "", location.search + "#" + step);
  st.step = step;
  ({zone: renderZoneStep, kind: renderKind, form: renderForm, done: () => {}})[step]();
  renderBar(); if (model) renderHead(); renderTabs(); window.scrollTo(0, 0);
  const h = $(`#s-${step} h2`); if (h) h.focus({preventScroll: true});
}
// v6.4 ② 구역 입력 탭: 구역을 고른 뒤 판정·측정 종류를 한 번에 오감 (종류 목록으로 돌아가지 않아도 됨)
function renderTabs() {
  const el = $("#ktabs"), z = (st.step === "kind" || st.step === "form") && model && curZone();
  el.hidden = !z; if (!z) return;
  const tabs = [["", "판정"], ...(z.pour_gate ? [["pour_batch", "타설 전 확인"]] : []), ["cylinder", "공시체"], ["sensor_temp", "온도"], ["sensor_strength", "강도 센서"],
    ["shore_check", "동바리 확인"], ["shore_inspect", "동바리 점검"], ["after_check", "해체 후"], ["rebound", "반발경도"]];

  const ov = (a, b) => Math.min(a.x1, b.x1) > Math.max(a.x0, b.x0) && Math.min(a.y1, b.y1) > Math.max(a.y0, b.y0);
  return order.filter(f => f < fl).reverse().slice(0, 3).map(f => { const F = model.floors.find(x => x.floor === f);
    return {floor: f, name: F.name, zones: F.zones.filter(q => ov(q, z))}; }).filter(g => g.zones.length);
}
const safeId = zid => String(zid).replace(/[^0-9A-Za-z_-]/g, "_");
function renderKind() {
  const z = curZone(); if (!z) return go("zone");
  $("#zcard").outerHTML = `<div id="zcard">${zoneCard(z)}</div>`;
  // 쓰임새로 묶음: 판정에 쓰는 측정 → 동바리 → 참고 (판정 미사용)
  const GROUPS = [["판정에 쓰는 측정", ["cylinder", "sensor_temp", "sensor_strength"]], ["동바리", ["shore_check", "shore_inspect"]],
    ["참고 · 판정에 안 씀", ["rebound", "after_check"]]];
  $("#kinds").innerHTML = GROUPS.map(([t, ks]) => `<h3 class="kh">${t}</h3><div class="kinds">` + ks.filter(k => KIND[k]).map(k => { const v = KIND[k];
    const s = v.sub.replace(/^참고 · 판정 미사용( · )?/, "");   // 묶음 제목이 이미 '참고'라 되풀이하지 않음
    return `<button type="button" class="kind${v.ref ? " ref" : ""}" data-k="${k}">${v.label}${s ? `<small>${s}</small>` : ""}</button>`; }).join("") + `</div>`).join("");
  if (z.pour_gate) {   // 아직 타설 전 구역 — 아래 3개층 동바리를 한 번에 확인 (v6.4 2-2)
    const n = pourTargets(z).reduce((a, g) => a + g.zones.length, 0);
    $("#kinds").insertAdjacentHTML("afterbegin", `<h3 class="kh">타설 전</h3><div class="kinds"><button type="button" class="kind" data-k="pour_batch">타설 전 동바리 일괄 확인<small>아래 3개층 ${n}구역 · 전부 서 있음 한 번 + 예외만 아니오</small></button></div>`);
  }
  for (const b of document.querySelectorAll("#kinds .kind")) b.onclick = () => { st.kind = b.dataset.k; st.sensor = null; st.mode = "one"; st.siLoaded = null; go("form"); };
  for (const b of document.querySelectorAll("#zcard [data-goto]")) b.onclick = () => {   // 타설 보류 사유의 아래층 구역 → 그 구역 동바리 확인
    const f = model.floors.find(f => f.zones.some(q => q.zone_id === b.dataset.goto)); if (!f) return;
    st.floor = f.floor; st.zone = b.dataset.goto; st.kind = "shore_check"; st.present = "예"; go("form"); };
}

// ---------- 3. 입력 ----------
const REQ = `<b class="req" aria-hidden="true">*</b><span class="sr">(필수)</span>`;   // U10 꼭 넣을 칸
const field = (id, label, inner, hint = "") =>
  `<div><label for="${id}">${label}${hint ? ` <span class="sub">${hint}</span>` : ""}</label>${inner}<p class="err" id="e-${id}"></p></div>`;
const numIn = (id, ph, next = "next") => `<input id="${id}" inputmode="decimal" enterkeyhint="${next}" placeholder="${ph}" aria-describedby="e-${id}">`;
function nameNote() {
  return field("f-name", "입력자" + REQ, `<input id="f-name" autocomplete="name" enterkeyhint="done" value="${esc(LS.get("name", ""))}" aria-describedby="e-f-name">`, "기록에 남습니다") +
    `<details${LS.get("noteOpen", false) ? " open" : ""}><summary>메모 (선택)</summary><input id="f-note" maxlength="200" enterkeyhint="done" aria-label="메모" aria-describedby="e-f-note"><p class="err" id="e-f-note"></p></details>`;
}
function sensorsHere() {
  return model.sensors.filter(s => s.floor === st.floor && s.kind === st.kind);
}
function nextSensorId() {
  const pre = st.kind === "sensor_temp" ? "S" : "W";
  const all = model.sensors.map(s => s.sensor_id), n = Math.max(0, ...all.filter(i => i.startsWith(pre)).map(i => parseInt(i.slice(1)) || 0));
  let id = pre + (n + 1); while (all.includes(id)) id = pre + (parseInt(id.slice(1)) + 1); return id;
}
// v6.4 G9 해체 후 침하 계측 (가이드라인 3.2.12①) — 지점 이름 + mm, 날마다 같은 지점을 다시 잼 (지점 이름은 구역마다 기억)

    `<div id="f-set-rows">${pts.map((p, i) => settleRow(p, i)).join("")}</div>` +
    `<button type="button" class="btn sec" id="f-set-add">＋ 지점 더하기</button><p class="err" id="e-f-settle"></p></details>`;
}
const settleRow = (p, i) => `<div class="three" data-set="${i}"><div><label for="f-set-p${i}" class="sub">지점</label><input id="f-set-p${i}" value="${esc(p)}" maxlength="10" autocapitalize="characters" enterkeyhint="next"></div>` +
  `<div><label for="f-set-v${i}" class="sub">침하 mm</label>${numIn("f-set-v" + i, "", "next")}</div></div>`;
function lotOf(z) {   // W1 타설 묶음: 이 구역과 같은 pour_id 를 가진 구역들 (2개 이상일 때만 고르기)
  const id = (z && z.pour_id || "").trim(); if (!id || !model) return null;
  const zs = model.floors.flatMap(f => f.zones).filter(x => (x.pour_id || "").trim() === id).map(x => x.zone_id);
  return zs.length > 1 ? {id, zones: zs} : null;
}

    if (item.body.kind === "shore_inspect" && !res.duplicate && !res.pending_sync) h += res.open_ng
      ? `<div class="msg w">이 구역 풀리지 않은 결함 기록: ${esc(res.open_ng)}<br>설치 검측 결함이 남아 있으면 해체 승인 요청을 할 수 없고 타설도 보류됩니다. 같은 항목을 다시 점검해 OK로 기록하면 풀립니다.</div>`
      : `<div class="msg o">이 구역 풀리지 않은 결함 기록 없음</div>`;
    if (res.zone) h += `<p class="sub">다시 계산한 판정 (${esc((res.now || "").replace("T", " "))} 기준)</p>` + zoneCard(res.zone);
    if (res.warning) h += `<div class="msg e">판정 계산 오류: ${esc(res.warning)}</div>`;
    if (item.body.kind === "cylinder" && res.zone && res.zone.decision !== "해체 승인 요청 가능")
      h += `<p class="sub">공시체가 기준 이상이어도, 센서로 추정한 구역 최소 강도와 층수 조건을 함께 봅니다.</p>`;
  } else {
    h += `<div class="msg w" role="status">${r === "token" ? "접속 코드가 바뀌었습니다. PC 화면의 새 QR 코드로 다시 여세요." : "서버에 연결되지 않았습니다."}<br>
      기록은 이 휴대폰에 저장했고, 연결되면 자동으로 보냅니다 (보낼 것 ${queue.filter(q => q.state === "pending").length}건).</div>`;
    if (item.photoMem) h += `<div class="msg w">휴대폰에 담아 둘 수 있는 사진(${PHOTO_QUEUE_MAX}장)을 넘었습니다. 이 화면을 열어 둔 동안 연결되면 사진도 함께 보내고, 화면을 닫으면 기록만 보냅니다.</div>`;
  }
  $("#result").innerHTML = h;
  history.replaceState({step: "done"}, "", location.search + "#done"); go("done", false);   // 뒤로 → 종류 고르기 (빈 폼 아님)
  say(r === "ok" ? "저장됨. " + (res.zone ? res.zone.zone_id + " " + res.zone.decision : "") : "휴대폰에 저장했습니다. 연결되면 보냅니다");
}

// ---------- 최근 입력 ----------
const kindLabel = k => (KIND[k] || {label: k}).label;
function qText(q) { const b = q.body, k = KIND[b.kind];
  const v = b.kind === "cylinder" ? `${b.f1}·${b.f2}·${b.f3} MPa` : b.kind === "shore_check" ? `동바리 ${b.present === "예" ? "서 있음" : "없음"}` : b.kind === "rebound" ? `R ${b.r_value}` : b.kind === "after_check" ? `${Object.keys(b.items || {}).length}항목` :
    b.kind === "shore_inspect" ? `${b.stage} ${(b.items || []).length}항목${(b.items || []).some(i => i.result === "NG") ? " · NG " + b.items.filter(i => i.result === "NG").length : ""}` : b.readings ? `${b.readings.length}줄` : `${b[k.col]} ${k.unit}`;
  return `${esc(kindLabel(b.kind))} <span class="k">${esc(b.zone_id || (b.pour_id && b.kind === "cylinder" ? "타설 " + b.pour_id : b.sensor_id))}</span> ${esc(v)}`; }
// 실패 기록을 그 값 그대로 폼에 다시 엶 (ui_reference_research 7절 #19) — 저장하면 옛 실패 기록은 새 기록으로 바뀜
function refill(q) {
  if (!q || !model) return;
  const b = q.body, zid = b.zone_id || q.zone;
  const f = zid ? model.floors.find(f => f.zones.some(z => z.zone_id === zid)) : model.floors.find(f => f.floor === Number(b.floor));
  if (!f) { say("이 기록의 구역을 지금 판정에서 찾을 수 없습니다. 지우고 새로 입력하세요"); return; }
  const z = zid ? zid : (f.zones[0] || {}).zone_id;
  Object.assign(st, {floor: f.floor, zone: z, kind: b.kind, fixId: b.client_id, cylLot: b.kind === "cylinder" && !b.zone_id && !!b.pour_id, mode: b.readings ? "paste" : "one",
    sensor: b.sensor_id && model.sensors.some(s => s.sensor_id === b.sensor_id) ? b.sensor_id : (b.sensor_id ? "__new" : null),
    curing: b.curing || st.curing, present: b.present || st.present, ac: b.items ? {...b.items} : st.ac, acz: z,
    siStage: b.stage || st.siStage, si: Array.isArray(b.items) ? Object.fromEntries(b.items.map(i => [i.item_code, {r: i.result, ids: [...(i.shore_ids || [])]}])) : st.si,
    siz: z, siActive: null, siLoaded: null});
  if (b.x != null && st.sensor === "__new") { st.nx = Number(b.x); st.ny = Number(b.y); st.nzone = z; }
  go("form");
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null && v !== "") el.value = String(v); };
  set("f-name", b.entered_by); set("f-note", b.note);
  set("f-date", b.test_date || b.date); set("f-ts", (b.timestamp || "").slice(0, 16));
  [1, 2, 3].forEach(i => set("f-f" + i, b["f" + i])); set("f-r", b.r_value);
  set("f-pid", b.pour_id); set("f-sat", (b.sampled_at || "").slice(0, 16)); set("f-sup", b.supplier); set("f-truck", b.truck_no); set("f-store", b.storage_zone);
  if (b.kind === "cylinder") set("f-cphoto", b.photo);
  else if (b.photo_data) { st.photo = b.photo_data; const e = document.getElementById("e-f-photo"); if (e) e.textContent = "앞서 고른 사진이 함께 저장됩니다. 바꾸려면 새로 고르세요"; }
  set("f-sid", st.sensor === "__new" ? b.sensor_id : null);
  if (b.kind === "rebound" || st.sensor === "__new") { set("f-x", b.x); set("f-y", b.y); }
  const k = KIND[b.kind]; if (k && k.col) set("f-val", b[k.col]);
  if (b.readings && k) { set("f-paste", b.readings.map(r => `${r.timestamp},${r[k.col]}`).join("\n")); if ($("#f-paste")) preview(); }
  say("보내지 못한 기록을 다시 열었습니다. 고친 뒤 저장하세요" + (q.error ? ": " + q.error : ""));
}
async function loadRecent() {
  const r = await api("/api/recent?n=15"), el = $("#recent");
  // 줄마다 어디에 저장됐는지 (ui_reference_research 7절 #7): 기기에만 저장 · 시각 → 보내면 서버 목록에 "서버 저장 ✓"
  const mine = queue.map((q, i) => `<li>${qText(q)}<span class="tag ${q.state === "failed" ? "f" : "q"}">${q.state === "failed" ? "보내지 못함" : "보낼 것"}</span>
      <div class="sub">휴대폰에만 저장 · ${esc(q.created)}${photoNote(q)}${q.error ? ` · <span style="color:var(--err)">${esc(q.error)}</span>` : ""}</div>
      ${q.state === "failed" ? `<button class="lnk" type="button" data-fix="${i}">고쳐서 다시 보내기</button> <button class="lnk del" type="button" data-del="${i}">이 기록 지우기</button>` : ""}</li>`).join("");
  let srv = "";
  if (r.status === 200 && r.j.ok) {
    setOnline(true);
    srv = r.j.items.map(it => `<li>${esc(it.label)} <span class="k">${esc(it.point)}</span> ${esc(it.value)}<span class="tag s">서버 저장 ✓</span>
      <div class="sub">${esc((it.when || "").replace("T", " "))} 측정 · ${esc(it.entered_by)} · ${esc((it.entered_at || "").slice(5, 16).replace("T", " "))} 저장${it.note ? " · " + esc(it.note) : ""}</div></li>`).join("");
  } else srv = `<li class="sub">${online ? "목록을 받지 못했습니다" : "연결되면 서버에 저장된 입력이 보입니다"}</li>`;
  el.innerHTML = (mine + srv) || `<li class="sub">아직 현장 입력이 없습니다</li>`;
  for (const b of el.querySelectorAll("[data-fix]")) b.onclick = () => refill(queue[Number(b.dataset.fix)]);
  for (const b of el.querySelectorAll("[data-del]")) b.onclick = () => { if (confirm("이 기록을 지울까요? 서버에 저장되지 않은 기록이라 지우면 되살릴 수 없습니다.")) { queue.splice(Number(b.dataset.del), 1); saveQueue(); loadRecent(); } };
}

// ---------- 시작 ----------
function setSun(on) { document.documentElement.classList.toggle("sun", on); const b = $("#sun"); b.setAttribute("aria-pressed", on); b.textContent = on ? "☀ 햇빛 켬" : "햇빛"; LS.set("sun", on); }
$("#sun").onclick = () => setSun(!document.documentElement.classList.contains("sun"));
setSun(!!LS.get("sun", false));
$("#badge").onclick = () => { flush().then(loadRecent); };
$("#reloadRecent").onclick = () => loadModel().then(() => { renderZoneStep(); loadRecent(); });
addEventListener("online", () => { loadModel().then(flush); });
addEventListener("offline", () => setOnline(false));
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadModel().then(() => { flush(); if (st.step === "zone") renderZoneStep(); }); });
setInterval(() => { if (queue.some(q => q.state === "pending")) loadModel().then(flush); }, 20000);
addEventListener("resize", () => { if (st.step === "zone") renderZones(); });
(async () => {
  renderBadge();
  const hf = /floor=(-?\d+)/.exec(location.hash);   // 층 표지 QR: …?t=TOKEN#floor=N (B1 = -1) → 그 층을 고른 채 시작, 없는 층이면 renderZoneStep 이 기본 층으로
  if (hf) st.floor = Number(hf[1]);
  history.replaceState({step: "zone"}, "", location.search + "#zone");
  go("zone", false);
  await loadModel();
  renderZoneStep(); loadRecent(); flush();
})();
</script>
</body>
</html>
