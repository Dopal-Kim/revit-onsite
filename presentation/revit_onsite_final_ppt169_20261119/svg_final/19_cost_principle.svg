    <g font-size="22" font-weight="bold" fill="#1D3557"><text x="572" y="206">한 층을 받치는 동바리 = 세트 하나</text><text x="572" y="322">빌려야 할 양 = 받치는 층 수</text><text x="572" y="438">"3개 층으로 충분한가"가 핵심</text></g>
    <g font-size="18" fill="#5B6673"><text x="572" y="240">다 굳은 맨 아래층 세트를 빼서 새로 부을 층 밑으로 올립니다</text><text x="572" y="356">4개 층을 받치면 4세트, 3개 층이면 3세트를 계속 빌려 둡니다</text><text x="572" y="472">불안해서 4번째 층을 남기는 대신, 프로그램이 하중비</text><text x="572" y="500">(아래 3개 층이 견디는가)를 구역마다 보여 줍니다</text></g>
