<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Malgun Gothic, Segoe UI, sans-serif">
  <defs>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F5FA8"/></marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 680 1152 24">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D5DCE4" stroke-width="1"/>
    <text x="64" y="700" font-size="12" fill="#5E6B7A">Revit On-Site · Build Up · 실제 화면: 대시보드 '오늘 볼 것' · 층 표지 (시연 자료, QR 영역 제외)</text>
    <text x="1216" y="700" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="12" fill="#5E6B7A" text-anchor="end">15 / 30</text>
  </g>
  <g id="header" data-pptx-bounds="64 44 1152 124">
    <rect x="64" y="56" width="10" height="10" fill="#1F5FA8"/>
    <text x="84" y="66" font-size="15" font-weight="bold" fill="#1F5FA8">03 · Revit On-Site · 무단 해체 의심</text>
    <text x="64" y="118" font-size="36" font-weight="bold" fill="#1B2A41">승인 없이 빼면, 그 순간 빨갛게 드러납니다</text>
    <text x="64" y="156" font-size="22" fill="#5E6B7A">해체하는 사람이 바로 기록을 남깁니다</text>
  </g>
  <g id="report-flow" data-pptx-bounds="64 188 400 268">
    <g fill="#EEF3F9"><rect x="64" y="192" width="400" height="76" rx="6"/><rect x="64" y="284" width="400" height="76" rx="6"/></g>
    <rect x="64" y="376" width="400" height="76" rx="6" fill="#E8613C"/>
    <use data-icon="tabler-outline/qrcode" x="80" y="214" width="32" height="32" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/database" x="80" y="306" width="32" height="32" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/alert-triangle" x="80" y="398" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <g font-size="18" font-weight="bold" fill="#1B2A41"><text x="128" y="226">반장이 층 QR로 '뺐음'</text><text x="128" y="318">승인 기록을 찾음</text></g>
    <text x="128" y="410" font-size="18" font-weight="bold" fill="#FFFFFF">없으면 즉시 '무단 해체 의심'</text>
    <g font-size="15" fill="#5E6B7A"><text x="128" y="250">이름(처음 한 번) · 구역 · 사진 1장</text><text x="128" y="342">감리 승인 기록이 있는 구역인가</text></g>
    <text x="128" y="434" font-size="15" fill="#FFFFFF">대시보드 · 휴대폰 '오늘 볼 것' 맨 위</text>
  </g>
  <g id="shot-alerts" data-pptx-bounds="488 188 356 268">
    <rect x="488" y="192" width="348" height="227" rx="6" fill="#1B2A41"/>
    <image href="../images/shot_20_alerts.png" x="492" y="196" width="340" height="219" preserveAspectRatio="xMidYMid meet"/>
    <text x="488" y="444" font-size="15" font-weight="bold" fill="#1B2A41">대시보드: 10F-B1 무단 해체 의심</text>
  </g>
  <g id="shot-sign" data-pptx-bounds="860 188 356 268">
    <rect x="860" y="192" width="356" height="176" rx="6" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1.5"/>
    <image href="../images/shot_27.png" x="864" y="196" width="348" height="164" preserveAspectRatio="xMidYMid meet"/>
    <text x="860" y="392" font-size="15" font-weight="bold" fill="#1B2A41">층 표지: 층 입구에 오늘 가능 / 금지</text>
    <text x="860" y="416" font-size="13" fill="#5E6B7A">인쇄 시각 표시 · 24시간 지나면 QR 화면으로 확인</text>
  </g>
  <g id="before-after" data-pptx-bounds="64 476 1152 180">
    <rect x="64" y="480" width="560" height="172" rx="6" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1.5"/>
    <text x="92" y="520" font-size="15" font-weight="bold" fill="#5E6B7A">지금 현장</text>
    <text x="92" y="562" font-size="24" font-weight="bold" fill="#1B2A41">해체 사실은 뺀 반장만 압니다</text>
    <text x="92" y="600" font-size="18" fill="#1E2633">원청과 감리는 뒤늦게 알고, 판정 근거는 흩어져<tspan x="92" dy="28">있다가 나중에 정리됩니다</tspan></text>
    <rect x="656" y="480" width="560" height="172" rx="6" fill="#1B2A41"/>
    <text x="684" y="520" font-size="15" font-weight="bold" fill="#D5DCE4">Revit On-Site</text>
    <text x="684" y="562" font-size="24" font-weight="bold" fill="#FFFFFF">해체하는 사람이 바로 남깁니다</text>
    <text x="684" y="600" font-size="18" fill="#EEF3F9">승인 없는 신고는 곧바로 빨갛게 표시되고,<tspan x="684" dy="28">원청과 감리도 같은 화면을 봅니다</tspan></text>
  </g>
