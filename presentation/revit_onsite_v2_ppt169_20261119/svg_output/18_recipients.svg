    <text x="64" y="156" font-size="22" fill="#5E6B7A">받는 사람이 실제로 쓰는 형태로 만듭니다</text>
  </g>
  <g id="recipient-cards" data-pptx-bounds="64 188 1152 380">
    <g fill="#EEF3F9"><rect x="64" y="192" width="214" height="372" rx="6"/><rect x="298" y="192" width="214" height="372" rx="6"/><rect x="532" y="192" width="214" height="372" rx="6"/><rect x="766" y="192" width="214" height="372" rx="6"/><rect x="1000" y="192" width="216" height="372" rx="6"/></g>
    <use data-icon="tabler-outline/settings" x="88" y="216" width="40" height="40" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/rosette-discount-check" x="322" y="216" width="40" height="40" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/tool" x="556" y="216" width="40" height="40" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/home" x="790" y="216" width="40" height="40" fill="#1F5FA8" stroke-width="2"/>
    <use data-icon="tabler-outline/world" x="1024" y="216" width="40" height="40" fill="#1F5FA8" stroke-width="2"/>
    <g font-size="22" font-weight="bold" fill="#1B2A41"><text x="88" y="300">시공사 공무</text><text x="322" y="300">감리</text><text x="556" y="300">협력업체 반장</text><text x="790" y="300">발주처</text><text x="1024" y="300">정부 · 제도</text></g>
    <g font-size="18" font-weight="bold" fill="#1F5FA8"><text x="88" y="340">판정표 · 대시보드</text><text x="322" y="340">검측요청서</text><text x="556" y="340">층 표지 QR</text><text x="790" y="340">슬래브 이력서</text><text x="1024" y="340">IFC · 근거 원장</text></g>
    <g stroke="#D5DCE4" stroke-width="1"><line x1="88" y1="364" x2="254" y2="364"/><line x1="322" y1="364" x2="488" y2="364"/><line x1="556" y1="364" x2="722" y2="364"/><line x1="790" y1="364" x2="956" y2="364"/><line x1="1024" y1="364" x2="1192" y2="364"/></g>
    <g font-size="15" fill="#1E2633">
      <text x="88" y="396">된 구역은 근거를 붙여<tspan x="88" dy="24">빨리 요청하고, 안 된</tspan><tspan x="88" dy="24">구역은 그대로 둡니다</tspan></text>
      <text x="322" y="396">확인할 세 가지와<tspan x="322" dy="24">판정 근거를 한 장에서</tspan><tspan x="322" dy="24">봅니다</tspan></text>
      <text x="556" y="396">층 입구에서 오늘 빼도<tspan x="556" dy="24">되는지 휴대폰으로</tspan><tspan x="556" dy="24">직접 봅니다</tspan></text>
      <text x="790" y="396">준공 뒤 하자 분쟁에<tspan x="790" dy="24">낼 수 있는 구역별</tspan><tspan x="790" dy="24">타설 · 양생 기록</tspan></text>
      <text x="1024" y="396">의무 공시체가 실제로<tspan x="1024" dy="24">쓰였는지 위치로</tspan><tspan x="1024" dy="24">확인합니다</tspan></text>
    </g>
  </g>
  <g id="verdict-line" data-pptx-bounds="64 588 1152 68">
